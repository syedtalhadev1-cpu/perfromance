<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Company Overview</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --border:#e3e1da; --border-strong:#cfccc2;
    --text:#1f1e1c; --text-2:#63615a; --text-3:#93918a;
    --accent:#2f5fa8; --accent-bg:#e8eef8;
    --green:#2f7d4f; --green-bg:#e5f2ea;
    --amber:#b8791a; --amber-bg:#faf1e2;
    --red:#b8382b; --red-bg:#f9e9e7;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding:32px;
  }
  .wrap{max-width:1080px; margin:0 auto;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:24px; flex-wrap:wrap; gap:12px;
  }
  h1{font-size:20px; font-weight:600; margin:0;}
  .sub{font-size:13px; color:var(--text-3); margin-top:4px;}
  select{
    font-size:14px; padding:9px 14px; border-radius:8px;
    border:1px solid var(--border-strong); background:#fff; color:var(--text);
    min-width:220px; cursor:pointer;
  }
  .kpis{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px; margin-bottom:20px;
  }
  .kpi{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px;
  }
  .kpi .label{font-size:12.5px; color:var(--text-3); margin-bottom:6px;}
  .kpi .value{font-size:26px; font-weight:600;}
  .kpi .value.small{font-size:20px;}

  .grid{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
  @media (max-width:760px){.grid{grid-template-columns:1fr;}}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px;
  }
  .card h2{font-size:14.5px; font-weight:600; margin:0 0 14px;}

  .proj-item{border-bottom:1px solid var(--border);}
  .proj-item:last-child{border-bottom:none;}

  .proj-row{
    display:flex; align-items:center; gap:12px; padding:10px 0;
    cursor:pointer; user-select:none;
  }
  .proj-row:hover{background:#fafaf8;}
  .chevron{
    font-size:11px; color:var(--text-3); width:12px; flex-shrink:0;
    transition:transform 0.15s ease;
  }
  .proj-item.open .chevron{transform:rotate(90deg);}
  .proj-name{font-size:13.5px; font-weight:500; flex:1; min-width:0;}
  .proj-owner{font-size:12px; color:var(--text-3); width:110px; flex-shrink:0;}
  .bar-track{flex:1.2; height:7px; background:#eeece6; border-radius:4px; overflow:hidden; min-width:60px;}
  .bar-fill{height:100%; border-radius:4px;}
  .hrs{font-size:11.5px; color:var(--text-3); width:88px; text-align:right; flex-shrink:0;}
  .pct{font-size:12px; color:var(--text-2); width:38px; text-align:right; flex-shrink:0;}
  .status-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}

  .proj-detail{
    display:none; padding:2px 0 16px 22px; font-size:12.5px; color:var(--text-2);
  }
  .proj-item.open .proj-detail{display:block;}
  .proj-detail .why{margin-bottom:10px; line-height:1.5;}
  .role-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px; margin-bottom:12px;
  }
  .role-box .role-label{font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:3px;}
  .role-box .role-val{font-size:13px; color:var(--text); font-weight:500;}
  .action-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px;}
  .action-table th{
    text-align:left; font-weight:600; color:var(--text-3); font-size:11px;
    text-transform:uppercase; letter-spacing:0.02em; padding:4px 8px 6px 0; border-bottom:1px solid var(--border);
  }
  .action-table td{padding:5px 8px 5px 0; border-bottom:1px solid var(--border);}
  .action-table tr:last-child td{border-bottom:none;}
  .total-actions{font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px;}

  .badge{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500;
    padding:4px 10px; border-radius:100px;
  }
  .badge.green{color:var(--green); background:var(--green-bg);}
  .badge.amber{color:var(--amber); background:var(--amber-bg);}
  .badge.red{color:var(--red); background:var(--red-bg);}

  .emp-list{
    list-style:none; margin:0; padding:0;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;
  }
  .emp-row{
    display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--border);
    border-radius:10px;
  }
  .avatar{
    width:30px; height:30px; border-radius:50%; background:var(--accent-bg); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex-shrink:0;
  }
  .emp-info{flex:1; min-width:0;}
  .emp-name{font-size:13px; font-weight:500;}
  .emp-stats{font-size:11.5px; color:var(--text-3); margin-top:2px;}
  .emp-bar-track{width:100%; height:6px; background:#eeece6; border-radius:3px; overflow:hidden; margin-top:6px;}
  .emp-bar-fill{height:100%; border-radius:3px; background:var(--accent);}

  .loading-note{font-size:12.5px; color:var(--text-3); padding:10px 0;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 id="companyTitle">Loading…</h1>
      <div class="sub" id="dateRangeSub">Company overview</div>
    </div>
    <select id="companySelect" onchange="render()">
      <option value="400">Devbox Software Pvt. Ltd. (400)</option>
      <option value="CRS">Creative Solutions (CRS)</option>
    </select>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="label">Employees</div><div class="value" id="kpiEmployees">-</div></div>
    <div class="kpi"><div class="label">Total projects</div><div class="value" id="kpiProjects">-</div></div>
    <div class="kpi"><div class="label">Achievement</div><div class="value" id="kpiAchievement">-</div></div>
    <div class="kpi"><div class="label">Status</div><div class="value small" id="kpiStatus">-</div></div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <h2>Important projects</h2>
    <div class="sub" style="margin:-8px 0 12px;">Click a project to see team &amp; actions</div>
    <div id="projectList"></div>
  </div>

  <div class="card">
    <h2>Team performance</h2>
    <div class="sub" style="margin:-8px 0 14px;">Projects completed vs assigned per employee</div>
    <ul class="emp-list" id="teamList"></ul>
  </div>

</div>

<script>
// ---- Configuration ----
const API_BASE  = "http://localhost:8001";
const FROM_DATE = "2024-01-01";
const TO_DATE   = "2026-12-31";

const colorMap = {green:"#2f7d4f", amber:"#b8791a", red:"#b8382b"};

function initials(n){
  if (!n) return "?";
  return n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
}

function resetToEmpty(message){
  document.getElementById("companyTitle").textContent = message || "No data found";
  document.getElementById("kpiEmployees").textContent = "-";
  document.getElementById("kpiProjects").textContent = "-";
  document.getElementById("kpiAchievement").textContent = "-";
  document.getElementById("kpiStatus").innerHTML = "-";
  document.getElementById("projectList").innerHTML = "";
  document.getElementById("teamList").innerHTML = "";
}

function toggleProject(idx){
  const el = document.getElementById(`proj-item-${idx}`);
  if (el) el.classList.toggle("open");
}

function renderProjectDetail(team){
  if (!team || Object.keys(team).length === 0) {
    return `<div class="loading-note">No team detail available for this project.</div>`;
  }

  const coordinator = (team.coordinator && team.coordinator.length) ? team.coordinator.join(", ") : "-";
  const informer = (team.informer && team.informer.length) ? team.informer.join(", ") : "-";
  const support = (team.support && team.support.length) ? team.support.join(", ") : "-";

  let actionRows = "";
  if (team.action_breakdown && team.action_breakdown.length) {
    actionRows = team.action_breakdown.map(a => `
      <tr>
        <td>${a.Employee || "-"}</td>
        <td>${a.action_count}</td>
        <td>${a.completed_count}</td>
      </tr>
    `).join("");
  }

  return `
    <div class="role-grid">
      <div class="role-box"><div class="role-label">Owner / Responsible</div><div class="role-val">${team.owner || "-"}</div></div>
      <div class="role-box"><div class="role-label">Coordinator</div><div class="role-val">${coordinator}</div></div>
      <div class="role-box"><div class="role-label">Informer</div><div class="role-val">${informer}</div></div>
      <div class="role-box"><div class="role-label">Support</div><div class="role-val">${support}</div></div>
    </div>
    <div class="total-actions">Total actions: ${team.total_actions}</div>
    ${actionRows ? `
      <table class="action-table">
        <thead><tr><th>Employee</th><th>Actions</th><th>Completed</th></tr></thead>
        <tbody>${actionRows}</tbody>
      </table>
    ` : `<div class="loading-note">No individual actions logged for this project.</div>`}
  `;
}

async function render(){
  const companyCode = document.getElementById("companySelect").value;
  document.getElementById("companyTitle").textContent = "Loading…";

  let c;
  try {
    const res = await fetch(`${API_BASE}/dashboard/${companyCode}?from_date=${FROM_DATE}&to_date=${TO_DATE}`);
    if (!res.ok) {
      resetToEmpty(`No data found for company ${companyCode}`);
      return;
    }
    c = await res.json();
  } catch (err) {
    resetToEmpty("Error connecting to API — is dashboard_api.py running on port 8001?");
    console.error(err);
    return;
  }

  document.getElementById("companyTitle").textContent = c.company_name;
  document.getElementById("dateRangeSub").textContent =
    `Company overview  •  ${c.date_range.from} to ${c.date_range.to}`;

  document.getElementById("kpiEmployees").textContent = c.employees;
  document.getElementById("kpiProjects").textContent = c.total_projects;
  document.getElementById("kpiAchievement").textContent = c.achievement_pct + "%";

  const statusEl = document.getElementById("kpiStatus");
  statusEl.innerHTML = `<span class="badge ${c.status.color}">${c.status.label}</span>`;

  // ---- Important projects (click to expand) ----
  const projList = document.getElementById("projectList");
  if (!c.projects || c.projects.length === 0) {
    projList.innerHTML = `<div class="loading-note">No important projects found for this range.</div>`;
  } else {
    projList.innerHTML = c.projects.map((p, idx) => {
      const pct = p.progress_pct || 0;
      const color = pct >= 70 ? "green" : pct >= 40 ? "amber" : "red";
      const used = p.used_hours ?? 0;
      const allocated = p.allocated_hours ?? 0;
      return `
        <div class="proj-item" id="proj-item-${idx}">
          <div class="proj-row" onclick="toggleProject(${idx})">
            <span class="chevron">&#9656;</span>
            <span class="status-dot" style="background:${colorMap[color]}"></span>
            <span class="proj-name">${p.project_name || "Untitled project"}</span>
            <span class="proj-owner">${p.owner || "-"}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${colorMap[color]}"></div></div>
            <span class="hrs">${used}/${allocated} hrs</span>
            <span class="pct">${pct}%</span>
          </div>
          <div class="proj-detail">
            <div class="why">${p.reason || ""}${p.description ? " — " + p.description : ""}</div>
            ${renderProjectDetail(p.team)}
          </div>
        </div>
      `;
    }).join("");
  }

  // ---- Team panel: total projects vs completed per employee ----
  const teamList = document.getElementById("teamList");
  const emps = c.employee_summary || [];
  if (!emps.length) {
    teamList.innerHTML = `<li class="loading-note">No employee data to show.</li>`;
  } else {
    teamList.innerHTML = emps.map(e => {
      const pctDone = e.total_projects ? Math.round((e.completed_projects / e.total_projects) * 100) : 0;
      return `
        <li class="emp-row">
          <span class="avatar">${initials(e.Employee)}</span>
          <div class="emp-info">
            <div class="emp-name">${e.Employee || "-"}</div>
            <div class="emp-stats">${e.completed_projects} of ${e.total_projects} projects completed</div>
          </div>
          <div class="emp-bar-track"><div class="emp-bar-fill" style="width:${pctDone}%"></div></div>
        </li>
      `;
    }).join("");
  }
}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Overview</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --border:#e3e1da; --border-strong:#cfccc2;
    --text:#1f1e1c; --text-2:#63615a; --text-3:#93918a;
    --accent:#2f5fa8; --accent-bg:#e8eef8;
    --green:#2f7d4f; --green-bg:#e5f2ea;
    --amber:#b8791a; --amber-bg:#faf1e2;
    --red:#b8382b; --red-bg:#f9e9e7;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding:32px;
  }
  .wrap{max-width:1180px; margin:0 auto;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:20px; flex-wrap:wrap; gap:12px;
  }
  h1{font-size:19px; font-weight:600; margin:0;}
  .sub{font-size:12.5px; color:var(--text-3); margin-top:2px;}
  select{
    font-size:14px; padding:9px 14px; border-radius:8px;
    border:1px solid var(--border-strong); background:#fff; color:var(--text);
    min-width:220px; cursor:pointer;
  }

  .ai-summary{
    display:flex; gap:10px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:13px 16px; margin-bottom:18px; font-size:13px; color:var(--text-2);
  }
  .ai-summary .dot{
    width:16px; height:16px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:1px;
  }

  .kpis{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px; margin-bottom:18px;
  }
  .kpi{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px;
  }
  .kpi .label{font-size:12px; color:var(--text-3); margin-bottom:6px;}
  .kpi .value{font-size:22px; font-weight:600;}
  .kpi .value.small{font-size:16px;}
  .kpi .delta{font-size:11.5px; margin-top:3px;}
  .kpi .delta.up{color:var(--red);}
  .kpi .delta.down{color:var(--green);}

  .grid2{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; margin-bottom:16px;}
  @media (max-width:820px){.grid2{grid-template-columns:1fr;}}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px;
  }
  .card h2{font-size:14px; font-weight:600; margin:0 0 12px;}
  .chart-wrap{position:relative; height:260px;}

  .role-row{
    display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;
  }
  .role-row:last-child{border-bottom:none;}
  .avatar{
    width:26px; height:26px; border-radius:50%; background:var(--accent-bg); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex-shrink:0;
  }
  .role-name{font-weight:500; flex:1;}
  .role-tag{font-size:11.5px; color:var(--text-3);}

  .log-row{
    display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12.5px;
  }
  .log-row:last-child{border-bottom:none;}
  .log-date{width:60px; color:var(--text-3); flex-shrink:0;}
  .log-desc{color:var(--text-2);}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{
    text-align:left; font-weight:600; color:var(--text-3); font-size:11.5px;
    text-transform:uppercase; letter-spacing:0.02em; padding-bottom:8px; border-bottom:1px solid var(--border);
  }
  td{padding:9px 6px 9px 0; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .badge{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:500;
    padding:3px 9px; border-radius:100px;
  }
  .badge.green{color:var(--green); background:var(--green-bg);}
  .badge.amber{color:var(--amber); background:var(--amber-bg);}
  .badge.red{color:var(--red); background:var(--red-bg);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 id="projTitle">Customer Portal Revamp</h1>
      <div class="sub">Project overview · 357 Co</div>
    </div>
    <select id="projSelect" onchange="render()">
      <option value="portal">Customer Portal Revamp</option>
      <option value="hr">HR Automation</option>
      <option value="vendor">Vendor Portal</option>
    </select>
  </header>

  <div class="ai-summary">
    <div class="dot"></div>
    <div id="aiText">-</div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="label">Days remaining</div><div class="value" id="kpiDays">-</div></div>
    <div class="kpi"><div class="label">Tasks completed</div><div class="value" id="kpiPct">-</div></div>
    <div class="kpi"><div class="label">Actions left</div><div class="value" id="kpiActions">-</div></div>
    <div class="kpi"><div class="label">Cost</div><div class="value small" id="kpiCost">-</div><div class="delta" id="kpiCostDelta"></div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>Allocated vs used hours — trend</h2>
      <div class="chart-wrap"><canvas id="hoursChart"></canvas></div>
    </div>
    <div class="card">
      <h2>Team roles &amp; responsibility</h2>
      <div id="rolesList"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>Open actions</h2>
      <table>
        <thead><tr><th>Action</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead>
        <tbody id="actionsBody"></tbody>
      </table>
    </div>
    <div class="card">
      <h2>Deadline &amp; cost log</h2>
      <div id="logList"></div>
    </div>
  </div>

</div>

<script>
const DATA = {
  portal: {
    title: "Customer Portal Revamp",
    company: "357 Co",
    aiSummary: "On schedule, 82% of tasks done, cost tracking 6% under budget. No blockers this week.",
    kpi: {days:18, pct:"82%", actions:6, cost:"$18,400", costDelta:{text:"6% under budget", dir:"down"}},
    hoursTrend: {
      labels:["W1","W2","W3","W4","W5","W6"],
      allocated:[80,160,240,320,400,480],
      used:[75,150,220,290,360,410]
    },
    roles: [
      {name:"Emily", role:"Lead developer"},
      {name:"Andrew", role:"Frontend"},
      {name:"Summer", role:"QA"},
      {name:"Alyssa", role:"Design"}
    ],
    actions: [
      {name:"Fix checkout redirect bug", owner:"Emily", due:"Aug 3", status:"amber"},
      {name:"Finalize payment UI copy", owner:"Alyssa", due:"Aug 4", status:"green"},
      {name:"Load test checkout flow", owner:"Summer", due:"Aug 6", status:"amber"},
      {name:"Client sign-off review", owner:"Emily", due:"Aug 8", status:"red"}
    ],
    log: [
      {date:"Jul 20", desc:"Deadline moved +5 days after scope addition (payment gateway)"},
      {date:"Jul 24", desc:"Cost re-forecast: -6% vs original estimate"},
      {date:"Jul 29", desc:"Client added checkout redirect fix as priority"}
    ]
  },
  hr: {
    title: "HR Automation",
    company: "357 Co",
    aiSummary: "1 action overdue, cost running 12% over budget — recommend reviewing scope with Andrew this week.",
    kpi: {days:9, pct:"40%", actions:9, cost:"$14,900", costDelta:{text:"12% over budget", dir:"up"}},
    hoursTrend: {
      labels:["W1","W2","W3","W4","W5","W6"],
      allocated:[70,140,210,280,350,420],
      used:[68,145,225,300,380,470]
    },
    roles: [
      {name:"Andrew", role:"Lead developer"},
      {name:"Priya", role:"Backend"},
      {name:"Marcus", role:"QA"}
    ],
    actions: [
      {name:"Fix leave-approval workflow bug", owner:"Andrew", due:"Jul 28", status:"red"},
      {name:"Integrate attendance API", owner:"Priya", due:"Aug 2", status:"amber"},
      {name:"Regression test onboarding flow", owner:"Marcus", due:"Aug 5", status:"green"}
    ],
    log: [
      {date:"Jul 18", desc:"Deadline moved +8 days — dependency on attendance API"},
      {date:"Jul 26", desc:"Cost re-forecast: +12% vs original estimate"},
      {date:"Jul 29", desc:"Leave-approval bug flagged as blocking overdue action"}
    ]
  },
  vendor: {
    title: "Vendor Portal",
    company: "Oregano",
    aiSummary: "Stalled — 3 actions overdue, cost 20% over budget. Blocking 2 downstream projects.",
    kpi: {days:-4, pct:"15%", actions:12, cost:"$21,200", costDelta:{text:"20% over budget", dir:"up"}},
    hoursTrend: {
      labels:["W1","W2","W3","W4","W5","W6"],
      allocated:[60,120,180,240,300,360],
      used:[65,135,210,280,350,415]
    },
    roles: [
      {name:"Sara", role:"Lead developer"},
      {name:"Omar", role:"Backend"},
      {name:"Nadia", role:"Integrations"}
    ],
    actions: [
      {name:"Fix vendor auth handshake", owner:"Sara", due:"Jul 22", status:"red"},
      {name:"Resolve billing sync mismatch", owner:"Omar", due:"Jul 25", status:"red"},
      {name:"Vendor onboarding docs", owner:"Nadia", due:"Jul 27", status:"red"}
    ],
    log: [
      {date:"Jul 10", desc:"Deadline moved +14 days after vendor API delay"},
      {date:"Jul 22", desc:"Cost re-forecast: +20% vs original estimate"},
      {date:"Jul 29", desc:"Escalated to boss — blocking Billing Migration and Reporting Suite"}
    ]
  }
};

let chartInstance = null;

function initials(n){ return n.slice(0,2).toUpperCase(); }

function render(){
  const key = document.getElementById("projSelect").value;
  const p = DATA[key];

  document.getElementById("projTitle").textContent = p.title;
  document.querySelector(".sub").textContent = "Project overview · " + p.company;
  document.getElementById("aiText").textContent = p.aiSummary;

  document.getElementById("kpiDays").textContent = p.kpi.days < 0 ? Math.abs(p.kpi.days) + "d overdue" : p.kpi.days;
  document.getElementById("kpiPct").textContent = p.kpi.pct;
  document.getElementById("kpiActions").textContent = p.kpi.actions;
  document.getElementById("kpiCost").textContent = p.kpi.cost;
  const delta = document.getElementById("kpiCostDelta");
  delta.textContent = p.kpi.costDelta.text;
  delta.className = "delta " + p.kpi.costDelta.dir;

  const rolesList = document.getElementById("rolesList");
  rolesList.innerHTML = p.roles.map(r => `
    <div class="role-row">
      <span class="avatar">${initials(r.name)}</span>
      <span class="role-name">${r.name}</span>
      <span class="role-tag">${r.role}</span>
    </div>
  `).join("");

  const badgeLabel = {green:"On track", amber:"At risk", red:"Overdue"};
  const actionsBody = document.getElementById("actionsBody");
  actionsBody.innerHTML = p.actions.map(a => `
    <tr>
      <td>${a.name}</td>
      <td>${a.owner}</td>
      <td>${a.due}</td>
      <td><span class="badge ${a.status}">${badgeLabel[a.status]}</span></td>
    </tr>
  `).join("");

  const logList = document.getElementById("logList");
  logList.innerHTML = p.log.map(l => `
    <div class="log-row"><span class="log-date">${l.date}</span><span class="log-desc">${l.desc}</span></div>
  `).join("");

  const ctx = document.getElementById("hoursChart").getContext("2d");
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: p.hoursTrend.labels,
      datasets: [
        {
          label: "Allocated hours",
          data: p.hoursTrend.allocated,
          borderColor: "#2f5fa8",
          backgroundColor: "rgba(47,95,168,0.12)",
          fill: true,
          tension: 0.3,
          pointRadius: 3
        },
        {
          label: "Used hours",
          data: p.hoursTrend.used,
          borderColor: "#2f7d4f",
          backgroundColor: "rgba(47,125,79,0.12)",
          fill: true,
          tension: 0.3,
          pointRadius: 3
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11.5 } } } },
      scales: {
        y: { grid: { color: "#eeece6" }, ticks: { font: { size: 11 } } },
        x: { grid: { display: false }, ticks: { font: { size: 11 } } }
      }
    }
  });
}

render();
</script>
</body>
</html>
